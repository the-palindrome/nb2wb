# nb2wb example configuration
#
# This file is intentionally opinionated. It is not a copy of the package
# defaults. Use it when you want a readable publication profile that also shows
# how wrapper options and safety settings fit into the same config file.

image_width: 1760
border_radius: 16

code:
  font_size: 42
  theme: "monokai"
  line_numbers: true
  font: "DejaVu Sans Mono"
  padding_x: 72
  padding_y: 56
  separator: 28

latex:
  font_size: 42
  dpi: 150
  color: "#111827"
  background: "#ffffff"
  padding: 52
  try_usetex: true
  preamble: |
    \usepackage{amsmath}
    \usepackage{xcolor}
    \definecolor{accent}{HTML}{1D4ED8}

table:
  mode: "image"
  font_size: 30
  header_background: "#e0f2fe"
  stripe_background: "#f8fafc"
  border_color: "#cbd5e1"
  shadow: true
  shadow_alpha: 18

safety:
  max_cells: 1500
  max_total_output_bytes: 20971520

target_options:
  table_mode: "image"
  toolbar_message: "Paste the article first, then copy any remaining images from the preview."
  theme_overrides:
    body-background: "#f8fafc"
    content-background: "#ffffff"
    toolbar-background: "#0f172a"
    toolbar-button-background: "#38bdf8"
    toolbar-button-color: "#082f49"
